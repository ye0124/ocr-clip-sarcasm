[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-clip-sarcasm"
version = "1.0.0"
description = "OCR-enhanced CLIP for multimodal sarcasm detection on MMSD2.0: code, configs and results"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
